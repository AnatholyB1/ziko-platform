# RLS Suite — Phase 22 Wave 0 gate, extended in phase 1 (v1.16) to cover the
# waitlist migration and its two proof suites. Since v1.19 it targets the
# ziko_-prefixed portfolio schema (supabase/portfolio-migrations/), see the apply step.
#
# Per .planning/phases/22-schema-foundation-rls-keystone/22-VALIDATION.md,
# every PR that touches Supabase migrations OR the RLS test scaffold must
# pass this workflow. Until repo secrets SUPABASE_TEST_URL,
# SUPABASE_TEST_PUBLISHABLE_KEY, and SUPABASE_TEST_SERVICE_ROLE_KEY are
# configured, the run will fail-skip — that is acceptable while no DDL
# ships in Wave 0.
name: RLS Suite

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/portfolio-migrations/**'
      - 'backend/api/test/rls/**'
      - 'backend/api/vitest.config.ts'
      - 'backend/api/package.json'
      - 'apps/web/src/actions/waitlist.ts'
      - 'apps/web/test/actions/**'
      - 'apps/web/vitest.config.ts'
      - '.github/workflows/test-rls.yml'
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_PROJECT_ID: ${{ secrets.SUPABASE_TEST_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # SUPABASE_TEST_URL/SUPABASE_PUBLISHABLE_KEY/SUPABASE_SERVICE_ROLE_KEY
      # aren't configured as repo secrets yet. Per the header comment, that's
      # meant to degrade to a skip rather than a hard failure — but nothing
      # actually implemented that until now, so every run failed instead.
      - name: Check test secrets configured
        id: secrets_check
        run: |
          if [ -n "$SUPABASE_TEST_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_TEST_URL/SUPABASE_PUBLISHABLE_KEY/SUPABASE_SERVICE_ROLE_KEY are not configured as repo secrets — skipping the RLS suite."
          fi

      # Installed from the repo root, not backend/api — this is an npm
      # workspaces monorepo with a single root lockfile. Running `npm ci`
      # from a workspace subfolder still triggers the root's `postinstall`
      # (patch-package), but scopes that lifecycle script's PATH to
      # backend/api/node_modules/.bin, where patch-package's bin doesn't
      # exist (it's hoisted to the root node_modules/.bin only) — causing
      # every run to fail with "patch-package: not found".
      - name: Install deps
        run: npm ci

      - name: Write .env.test
        if: steps.secrets_check.outputs.configured == 'true'
        working-directory: backend/api
        run: |
          cat > .env.test <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          SUPABASE_TEST_URL=${SUPABASE_TEST_URL}
          EOF

      # SCHEMA UNDER TEST (post v1.19). The specs query the `ziko_`-prefixed tables and
      # RPCs of the shared `portfolio` schema, which lives in supabase/portfolio-migrations/
      # (supabase/migrations/ is the frozen, unprefixed legacy history and would create
      # the WRONG table names). The suite signs users up and deletes them, so it must run
      # against a DISPOSABLE test project, never the production portfolio project.
      # Requirements for SUPABASE_TEST_PROJECT_ID's project: it must have the portfolio
      # prerequisites already (auth gate / baseline from
      # scripts/portfolio-migration/00-bootstrap-supabase-functions.sql). When
      # SUPABASE_TEST_PROJECT_ID is unset the apply step is skipped and the suites run
      # against whatever schema SUPABASE_TEST_URL already holds (apply it manually).
      - name: Setup Supabase CLI
        if: env.SUPABASE_TEST_PROJECT_ID != ''
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Apply portfolio migrations to test project
        if: env.SUPABASE_TEST_PROJECT_ID != ''
        run: |
          if [ "$SUPABASE_TEST_PROJECT_ID" = "ubxllsvanurkwkohzxau" ]; then
            echo "::error::refusing to run the RLS suite against the production portfolio project"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_TEST_PROJECT_ID"
          for f in $(ls supabase/portfolio-migrations/*.sql | sort); do
            echo "applying $f"
            supabase db query --linked -f "$f"
          done

      - name: Run RLS suite
        if: steps.secrets_check.outputs.configured == 'true'
        working-directory: backend/api
        run: npm run test:rls -- --run

      - name: Guard — no service-role references under src/
        run: |
          # Exclude whole-line comments — this guard should only catch actual
          # code usage, not documentation like "no service-role key is used
          # in this module" (backend/api/src/coach/imports/db.ts:13), which
          # was a false positive.
          MATCHES=$(grep -rnE 'SUPABASE_SERVICE_ROLE_KEY|service[_-]role' backend/api/src/ | grep -vE ':[0-9]+:\s*//' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::service-role reference detected under backend/api/src/. ARCH-03 violation."
            exit 1
          fi

  web-waitlist:
    name: Web waitlist concurrency + non-disclosure
    needs: rls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check test secrets configured
        id: secrets_check
        run: |
          if [ -n "$SUPABASE_TEST_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_TEST_URL/SUPABASE_PUBLISHABLE_KEY/SUPABASE_SERVICE_ROLE_KEY are not configured as repo secrets — skipping the waitlist suite."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run waitlist concurrency + non-disclosure suite
        if: steps.secrets_check.outputs.configured == 'true'
        working-directory: apps/web
        run: npx vitest run test/actions/waitlist.concurrency.test.ts
