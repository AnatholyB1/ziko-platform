name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  # ─── Gate: type-check + lint + unit tests (all packages via turbo) ─────
  verify:
    name: type-check / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Type-check
        run: npx turbo run type-check
      - name: Lint
        run: npx turbo run lint
      - name: Test
        run: npx turbo run test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ─── Migrations Supabase (only on push to main) ─────────────────────────
  # Note: Vercel handles API + web deployments via GitHub integration.
  migrate-supabase:
    name: Apply Supabase migrations
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for migration changes
        id: migrations
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: steps.migrations.outputs.changed == 'true'
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          # Mark all existing migrations as applied except the new ones,
          # so db push only runs the new files.
          NEW=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/migrations/' | xargs -I{} basename {} .sql)
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" .sql)
            if ! echo "$NEW" | grep -qx "$version"; then
              supabase migration repair --status applied "$version" 2>/dev/null || true
            fi
          done
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ─── Guard: no SERVICE_ROLE under coach/ (ARCH-02, D-12) ────────────────
  no-service-role-in-coach:
    name: Verify no SERVICE_ROLE under coach/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep guard
        run: |
          if [ -d backend/api/src/coach ]; then
            if grep -r 'SERVICE_ROLE' backend/api/src/coach/; then
              echo "FAIL: SERVICE_ROLE reference found under backend/api/src/coach/"
              exit 1
            fi
          fi
          echo "PASS: no SERVICE_ROLE under coach/ (or directory does not exist yet)"

  # ─── Guard: no react-native in web bundle (D-02) ────────────────────────
  bundle-hygiene:
    name: Verify no react-native in web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Build with analyzer
        run: ANALYZE=true npx turbo run build --filter=ziko-web
      - name: Assert RN-clean bundle
        run: |
          if grep -E '"name":\s*"[^"]*react-native(?!-web)' apps/web/.next/analyze/stats.json; then
            echo "FAIL: react-native leaked into web bundle"
            exit 1
          fi
          echo "PASS: web bundle is RN-clean"

  # ─── Guard: Zod version drift (D-08) ────────────────────────────────────
  zod-drift:
    name: coach-sdk zod resolves to root zod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Verify zod is hoisted, not duplicated
        run: |
          ROOT_ZOD=$(node -e "console.log(require.resolve('zod'))")
          SDK_ZOD=$(node -e "console.log(require.resolve('zod', { paths: ['packages/coach-sdk'] }))")
          if [ "$ROOT_ZOD" != "$SDK_ZOD" ]; then
            echo "FAIL: coach-sdk resolves a different zod than root"
            echo "  ROOT: $ROOT_ZOD"
            echo "  SDK:  $SDK_ZOD"
            exit 1
          fi
          echo "PASS: zod resolves to single instance ($ROOT_ZOD)"
