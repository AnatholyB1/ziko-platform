name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  # ─── Gate: type-check + lint + unit tests (all packages via turbo) ─────
  verify:
    name: type-check / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Type-check
        run: npx turbo run type-check
      - name: Lint
        run: npx turbo run lint
      - name: Test
        # Remote verify specs disabled (Phase 7 D-12b): scratch deleted; re-enable against a dedicated CI project at milestone close-out
        run: npx turbo run test

  # ─── Guard: frozen legacy migrations + ziko_-only portfolio SQL (D-16) ──
  migration-guard:
    name: migration-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Legacy migrations are frozen
        run: node scripts/portfolio-migration/16-ci-migration-guard.mjs --check-legacy
      - name: Portfolio migrations are ziko_-only
        run: node scripts/portfolio-migration/16-ci-migration-guard.mjs --check-portfolio

  # ─── Portfolio migrations (dormant until PORTFOLIO_MIGRATIONS_ENABLED=true) ─
  # Applies only ziko_ portfolio migrations newer than scripts/portfolio-migration/portfolio-migrations.watermark;
  # bump the watermark in the commit after a successful apply. Legacy supabase/migrations/ is frozen
  # (ziko history, never pushed).
  # Note: Vercel handles API + web deployments via GitHub integration.
  migrate-portfolio:
    name: migrate-portfolio
    needs: [verify, migration-guard]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && vars.PORTFOLIO_MIGRATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Refuse any project other than portfolio
        run: |
          if [ "$SUPABASE_PROJECT_ID" != "ubxllsvanurkwkohzxau" ]; then
            echo "refusing: not portfolio"
            exit 1
          fi
          echo "project ref ok"
      - name: Link portfolio project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Read-only proof of link
        run: |
          supabase db query --linked -o json "select count(*)::int as ziko_tables from pg_tables where schemaname = 'public' and left(tablename, 5) = 'ziko_'" > proof.json
          node -e "
            const raw = require('fs').readFileSync('proof.json', 'utf8');
            const m = raw.match(/\"ziko_tables\"\s*:\s*(\d+)/);
            const n = m ? Number(m[1]) : -1;
            console.log('ziko_ tables:', n);
            if (n < 99) { console.error('FAIL: expected >= 99 ziko_ tables'); process.exit(1); }
          "
      - name: Apply pending portfolio migrations
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            PENDING=$(node scripts/portfolio-migration/16-ci-migration-guard.mjs --pending --base HEAD~1)
          else
            PENDING=""
          fi
          if [ -z "$PENDING" ]; then
            echo "no pending portfolio migrations"
            exit 0
          fi
          for f in $PENDING; do
            echo "applying $f"
            supabase db query --linked -f "$f"
          done

  # ─── Guard: no SERVICE_ROLE under coach/ (ARCH-02, D-12) ────────────────
  no-service-role-in-coach:
    name: Verify no SERVICE_ROLE under coach/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep guard
        run: |
          if [ -d backend/api/src/coach ]; then
            if grep -r 'SERVICE_ROLE' backend/api/src/coach/; then
              echo "FAIL: SERVICE_ROLE reference found under backend/api/src/coach/"
              exit 1
            fi
          fi
          echo "PASS: no SERVICE_ROLE under coach/ (or directory does not exist yet)"

  # ─── Guard: no react-native in web bundle (D-02) ────────────────────────
  bundle-hygiene:
    name: Verify no react-native in web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm install
      - name: Build with analyzer
        run: ANALYZE=true npx turbo run build --filter=ziko-web
      - name: Assert RN-clean bundle
        run: |
          if grep -E '"name":\s*"[^"]*react-native(?!-web)' apps/web/.next/analyze/stats.json; then
            echo "FAIL: react-native leaked into web bundle"
            exit 1
          fi
          echo "PASS: web bundle is RN-clean"

  # ─── Guard: Zod version drift (D-08) ────────────────────────────────────
  zod-drift:
    name: coach-sdk zod resolves to root zod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Verify zod is hoisted, not duplicated
        run: |
          ROOT_ZOD=$(node -e "console.log(require.resolve('zod'))")
          SDK_ZOD=$(node -e "console.log(require.resolve('zod', { paths: ['packages/coach-sdk'] }))")
          if [ "$ROOT_ZOD" != "$SDK_ZOD" ]; then
            echo "FAIL: coach-sdk resolves a different zod than root"
            echo "  ROOT: $ROOT_ZOD"
            echo "  SDK:  $SDK_ZOD"
            exit 1
          fi
          echo "PASS: zod resolves to single instance ($ROOT_ZOD)"
