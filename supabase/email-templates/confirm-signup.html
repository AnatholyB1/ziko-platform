<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirme ton email Ziko</title></head>
<body style="margin:0;padding:0;background:#F7F6F3;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;">Ton code de confirmation Ziko : {{ .Token }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F6F3;">
    <tr><td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
        <tr><td style="padding:0 0 12px 0;font-size:28px;font-weight:700;color:#FF5C1A;letter-spacing:-0.5px;">ZIKO</td></tr>
        <tr><td style="background:#FFFFFF;border:1px solid #E2E0DA;border-radius:12px;padding:32px;">
          <p style="margin:0 0 12px 0;font-size:18px;font-weight:600;color:#1C1A17;">Confirme ton adresse email</p>
          <p style="margin:0 0 20px 0;font-size:14px;line-height:21px;color:#1C1A17;">Saisis ce code dans l’application Ziko pour activer ton compte :</p>
          <p style="margin:0 0 20px 0;font-size:32px;font-weight:700;letter-spacing:8px;color:#1C1A17;text-align:center;background:#F7F6F3;border:1px solid #E2E0DA;border-radius:12px;padding:16px 0;">{{ .Token }}</p>
          <p style="margin:0;font-size:12.5px;line-height:19px;color:#6B6963;">Ce code expire dans 1 heure. Si tu n’as pas créé de compte Ziko, ignore simplement ce message.</p>
        </td></tr>
        <tr><td style="padding:16px 0 0 0;font-size:11.5px;color:#6B6963;text-align:center;">Ziko &middot; contact@ziko-app.com</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
