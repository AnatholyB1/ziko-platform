# v1.21 UATN-03 (garde 0 exercice) : le program-builder refuse un programme sans exercice (alerte), aucune creation.
appId: com.ziko.mobile
env:
  UAT_EMAIL: ${UAT_EMAIL}
  UAT_PASSWORD: ${UAT_PASSWORD}
---
- runFlow: v121-common-to-home.yaml
- tapOn: "Manuel"
- extendedWaitUntil:
    visible: "Etape 1/4"
    timeout: 30000
- tapOn: "Force"
- tapOn: "Continuer"
- extendedWaitUntil:
    visible: "Etape 2/4"
    timeout: 10000
- tapOn: "Continuer"
- extendedWaitUntil:
    visible: "Etape 3/4"
    timeout: 10000
- tapOn: "L"
- tapOn: "Continuer"
- extendedWaitUntil:
    visible: "Etape 4/4"
    timeout: 10000
- assertVisible: "0 exercice"
- tapOn: "Creer mon programme"
- extendedWaitUntil:
    visible: ".*Ajoute au moins un exercice.*"
    timeout: 10000
- takeScreenshot: n03d-zero-exercise-blocked
# Rien n'a ete cree : la carte reste sur l'accueil.
- tapOn: "OK"
# Texte libre hors catalogue : erreur inline, creation bloquee (bouton desactive / alerte), rien n'est cree.
- tapOn: "Nom de l'exercice..."
- inputText: "zzqxv"
- takeScreenshot: n03d-unknown-text
- hideKeyboard
- assertVisible: ".*(reconnu|catalogue).*"
- tapOn: "Creer mon programme"
- takeScreenshot: n03d-unknown-blocked
- assertNotVisible: "Programme actif.*"
