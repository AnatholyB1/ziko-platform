# v1.21 UATN-03 (chemin IA simple) : carte "Crée ton premier entraînement" -> IA simple (ai-generate, 4 etapes) ->
# "Démarrer cette séance" -> séance lancée. Le faux Anthropic est empile par .maestro/scripts/v121-queue-session.js.
appId: com.ziko.mobile
env:
  UAT_EMAIL: ${UAT_EMAIL}
  UAT_PASSWORD: ${UAT_PASSWORD}
---
- runFlow: v121-common-to-home.yaml
- takeScreenshot: n03b-01-home-card
- tapOn: "IA simple"
- extendedWaitUntil:
    visible: "Étape 1/4"
    timeout: 30000
- takeScreenshot: n03b-02-ai-generate-step1
- tapOn: "Continuer"
- tapOn: "45 min"
- tapOn: "Continuer"
- tapOn: "Full body"
- tapOn: "Continuer"
- tapOn: "Salle complète"
- runScript: scripts/v121-queue-session.js
- tapOn: "Générer ma séance"
- extendedWaitUntil:
    visible: "Ta séance générée"
    timeout: 60000
- takeScreenshot: n03b-03-generated
- assertVisible: "Squat goblet"
- assertVisible: "Démarrer cette séance"
- tapOn: "Démarrer cette séance"
- takeScreenshot: n03b-04-session-opened
