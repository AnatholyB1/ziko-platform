# TF-C: (1) mission d'onboarding visible sur l'accueil d'un compte frais, (2) Programmes IA ouvrable des le niveau 1.
# Prerequis identiques a TF-B: create-fresh-athlete.mjs ; SKIP=1 bash scripts/uat/fake-script.sh assess hydration_log ;
#   pm clear + dev-open.sh ; Metro 8281 ; backend 8200.
# Lancer: bash scripts/uat/evidence.sh run tf c-home-mission-ai-programs .maestro/tf-c-home-mission-ai-programs.yaml UAT_EMAIL=... UAT_PASSWORD=...
appId: com.ziko.mobile
env:
  UAT_EMAIL: ${UAT_EMAIL}
  UAT_PASSWORD: ${UAT_PASSWORD}
---
- runFlow: tf-common-login.yaml
- runFlow: tf-common-onboarding-steps.yaml
- extendedWaitUntil:
    visible: "Reponse simulee du coach IA.*"
    timeout: 60000
- tapOn: "Écris ta réponse…"
- inputText: "Je debute, je veux me remettre au sport"
- hideKeyboard
- tapOn: "Envoyer"
- extendedWaitUntil:
    visible: "TA PREMIÈRE MISSION"
    timeout: 60000
- tapOn: "Boire un verre d'eau →"
# Pre-permission notifications intercalee juste apres le CTA.
- extendedWaitUntil:
    visible: "Plus tard"
    timeout: 30000
- tapOn: "Plus tard"
# Le CTA de la carte ouvre directement Hydratation (plugin debloque niveau 1).
- extendedWaitUntil:
    visible: "Hydratation"
    timeout: 60000
- takeScreenshot: 09-cta-hydration
- tapOn: "Accueil"
# Ecran de pre-permission notifications eventuellement intercale avant l'accueil.
- tapOn:
    text: "Plus tard"
    optional: true
# Arrivee sur l'accueil : la carte Mission doit montrer la mission de Ziko (avant le correctif: "pas de mission").
- extendedWaitUntil:
    visible: "Mission du jour"
    timeout: 60000
- takeScreenshot: 10-home-mission
- assertVisible: "Bois un premier verre d'eau"
- assertVisible: "C'est parti"
# --- Programmes IA : ouvrable au niveau 1 (avant: minLevel 4 -> renvoye a l'accueil) ---
- openLink: "ziko:///ai-programs/dashboard"
- extendedWaitUntil:
    notVisible: "Mission du jour"
    timeout: 30000
- takeScreenshot: 11-ai-programs-dashboard
- assertNotVisible: "Mission du jour"
