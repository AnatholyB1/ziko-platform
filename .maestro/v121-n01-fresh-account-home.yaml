# v1.21 UATN-01 : compte neuf -> login -> 7 etapes d'onboarding -> 1re conversation Ziko -> 1re mission -> ACCUEIL.
# Reset : create-fresh-athlete.mjs ; fake-script.sh clear ; SKIP=1 fake-script.sh assess hydration_log ; pm clear ; dev-open.sh
# Run : bash scripts/uat/evidence.sh run v121 n01-fresh-account-home .maestro/v121-n01-fresh-account-home.yaml UAT_EMAIL=... UAT_PASSWORD=...
appId: com.ziko.mobile
env:
  UAT_EMAIL: ${UAT_EMAIL}
  UAT_PASSWORD: ${UAT_PASSWORD}
---
- runFlow: tf-common-login.yaml
- runFlow: v121-common-onboarding.yaml
- extendedWaitUntil:
    visible: "Reponse simulee du coach IA.*"
    timeout: 60000
- takeScreenshot: 06-ziko-first-reply
- tapOn: "Écris ta réponse…"
- inputText: "Je debute, je veux me remettre au sport"
- hideKeyboard
- tapOn: "Envoyer"
- extendedWaitUntil:
    visible: "TA PREMIÈRE MISSION"
    timeout: 60000
- takeScreenshot: 07-mission-card
- assertVisible: "Bois un premier verre d'eau"
- tapOn: "Boire un verre d'eau →"
- extendedWaitUntil:
    visible: "Plus tard"
    timeout: 30000
- tapOn: "Plus tard"
- extendedWaitUntil:
    visible: "Hydratation"
    timeout: 60000
- takeScreenshot: 08-cta-hydration
- tapOn: "Accueil"
- tapOn:
    text: "Plus tard"
    optional: true
# ACCUEIL : la carte du premier entrainement doit etre la premiere carte (FWKO-01).
- extendedWaitUntil:
    visible: "Crée ton premier entraînement"
    timeout: 60000
- takeScreenshot: 10-home-top
- assertVisible: "Trois façons de commencer."
- assertVisible: "Manuel"
- assertVisible: "IA simple"
- assertVisible: "Atelier IA"
- assertVisible: "Gratuit"
- assertVisible: "Conseillé"
- assertNotVisible: "Voir tout"
- assertNotVisible: "Tout voir"
- assertNotVisible: ".*[Ee]chou.*"
- assertNotVisible: ".*[Ee]xpir.*"
- scrollUntilVisible:
    element: "Mission du jour"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 11-home-mission
- assertVisible: "Bois un premier verre d'eau"
- scrollUntilVisible:
    element: "Quêtes du jour"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: "Termine une séance"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 12-home-quests
- assertVisible: "Bois 2 litres d'eau"
- assertVisible: "Ajoute un repas"
- assertVisible: "Termine une séance"
- assertVisible: "3 en cours"
- assertNotVisible: "Tout voir"
- assertNotVisible: "Voir tout"
- assertNotVisible: ".*[Ee]chou.*"
- assertNotVisible: ".*[Mm]anqu.*"
- assertNotVisible: ".*[Ee]xpir.*"
- scrollUntilVisible:
    element: "Forme du jour"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 13-home-forme
