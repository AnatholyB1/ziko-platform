        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>{f.name}</div>
          <div style={{ fontSize: 10.5, color: "var(--success)" }}>● {f.status}</div>
        </div>
        <button style={{
          width: 34, height: 34, borderRadius: 11, border: "none", cursor: "pointer",
          background: "color-mix(in srgb, var(--text) 6%, transparent)",
          display: "grid", placeItems: "center",
        }}>
          <Icon name="more" size={15}/>
        </button>
      </div>

      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "14px 14px 6px" }}>
        <div style={{ textAlign: "center", fontSize: 10.5, color: "var(--muted)", marginBottom: 14 }}>
          Aujourd'hui · 14:30
        </div>
        {msgs.map((m, i) => (
          <div key={i} style={{
            display: "flex", marginBottom: 6,
            justifyContent: m.from === "me" ? "flex-end" : "flex-start",
          }}>
            <div style={{
              maxWidth: "75%", padding: "8px 12px", borderRadius: 16,
              background: m.from === "me" ? "var(--primary)" : "var(--surface)",
              color: m.from === "me" ? "#fff" : "var(--text)",
              border: m.from === "me" ? "none" : "1px solid var(--border)",
              fontSize: 13, lineHeight: 1.4,
              borderTopRightRadius: m.from === "me" ? 4 : 16,
              borderTopLeftRadius: m.from === "them" ? 4 : 16,
            }}>
              {m.text}
              <div style={{ fontSize: 9.5, marginTop: 3, opacity: .7 }}>{m.time}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{
        flex: "0 0 auto", padding: "10px 14px 16px",
        borderTop: "1px solid var(--border)", display: "flex", gap: 8, alignItems: "flex-end",
        background: "var(--bg)",
      }}>
        <button style={{
          width: 38, height: 38, borderRadius: 11, border: "none", cursor: "pointer",
          background: "color-mix(in srgb, var(--text) 6%, transparent)",
          display: "grid", placeItems: "center",
        }}>
          <Icon name="plus" size={16}/>
        </button>
        <div className="card" style={{ flex: 1, padding: "9px 12px", display: "flex", alignItems: "center" }}>
          <input
            value={input} onChange={(e) => setInput(e.target.value)}

            placeholder="Message…"
            style={{ flex: 1, border: "none", outline: "none", fontSize: 13, fontFamily: "var(--font-body)", background: "transparent", color: "var(--text)" }}/>

        }}>
          <Icon name="arrow-up" size={15} color="#fff"/>

};

function Field({ label, value, onChange, prefix, multiline, maxLength }) {
  return (

            style={{ flex: 1, border: "none", outline: "none", fontSize: 13, fontFamily: "var(--font-body)", background: "transparent", color: "var(--text)", resize: "none" }}/>

      </div>
      {maxLength && (
        <div style={{ fontSize: 10, color: "var(--muted)", textAlign: "right", marginTop: 4 }}>{value.length}/{maxLength}</div>
      )}
    </div>
  );
}

// Composite "Forme du jour" — 1 ring instead of 4 separate cards
function FormRing({ data }) {
  const size = 160; const stroke = 11;
  const radius = (size - stroke) / 2;
  const C = 2 * Math.PI * radius;
  // 4 segments
  const segs = data.parts;
  const total = segs.reduce((s, p) => s + p.value, 0);
  let offset = 0;
  return (
    <svg width={size} height={size} style={{ display: "block" }}>
      <circle cx={size/2} cy={size/2} r={radius} stroke="rgba(28,26,23,.06)" strokeWidth={stroke} fill="none"/>
      {segs.map((p, i) => {
        const portion = (p.value / total) * 0.92; // leave a small gap
        const len = C * portion;
        const gap = C - len;
        const el = (
          <circle key={p.key}
            cx={size/2} cy={size/2} r={radius}
            stroke={p.color} strokeWidth={stroke} strokeLinecap="round"
            strokeDasharray={`${len} ${gap}`}
            strokeDashoffset={-offset * C}
            fill="none"
            transform={`rotate(-90 ${size/2} ${size/2})`}
            style={{ transition: "stroke-dashoffset .6s ease" }}
          />
        );
        offset += portion + 0.02;
        return el;
      })}
    </svg>
  );
}

// ===== app =====
// App shell — phone screen with tabs + tweaks
// (useState already destructured above)

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cards": "shadow",
  "primary": "#FF5C1A",
  "density": "comfy",
  "type": "manrope",
  "showOnboarding": true,
  "showAuth": true
}/*EDITMODE-END*/;

function App() {
  const [tab, setTab] = useState("home");
  const [drawer, setDrawer] = useState(false);
  const [plugin, setPlugin] = useState(null);
  const [bugOpen, setBugOpen] = useState(false);
  const [onboardingDone, setOnboardingDone] = useState(false);
  const [authDone, setAuthDone] = useState(false);
  const [paywallOpen, setPaywallOpen] = useState(false);
  const [rechargeOpen, setRechargeOpen] = useState(false);
  const [notifsOpen, setNotifsOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(null); // null | "own" | "other"
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [extraScreen, setExtraScreen] = useState(null); // { kind, props? }
  const [searchOpen, setSearchOpen] = useState(false);
  // Workout navigation stack — null | { screen, exerciseId? }
  const [wstack, setWstack] = useState([]);
  const wgo = (screen, params = {}) => setWstack((s) => [...s, { screen, ...params }]);
  const wback = () => setWstack((s) => s.slice(0, -1));
  const wreset = () => setWstack([]);
  const current = wstack[wstack.length - 1];
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply tweaks to body data attrs + CSS vars
  React.useEffect(() => {
    document.body.dataset.cards = tweaks.cards;
    document.body.dataset.density = tweaks.density;
    document.body.dataset.type = tweaks.type;
    document.documentElement.style.setProperty("--primary", tweaks.primary);
  }, [tweaks]);

  // expose globally so Profile entry, drawer, etc. can open it
  React.useEffect(() => { window.__openBug = () => setBugOpen(true); }, []);
  React.useEffect(() => {
    window.__openPaywall = () => setPaywallOpen(true);
    window.__openRecharge = () => setRechargeOpen(true);
    window.__openNotifs = () => setNotifsOpen(true);
    window.__openProfile = (mode = "own") => setProfileOpen(mode);
    window.__openSettings = () => setSettingsOpen(true);
    window.__openSearch = () => setSearchOpen(true);
    window.__openExtra = (kind, props) => setExtraScreen({ kind, props: props || {} });
  }, []);

  // current screen label for context-capture in the report
  const screenLabel = current
    ? `Workout · ${current.screen}`
    : plugin
    ? `Plugin · ${plugin}`
    : tab === "home" ? "Accueil"
    : tab === "workout" ? "Séance"
    : "Profil";

  return (
    <div className="phone">
      {tweaks.showAuth && !authDone && (
        <AuthFlow onAuthenticated={() => setAuthDone(true)}/>
      )}
      {tweaks.showOnboarding && (!tweaks.showAuth || authDone) && !onboardingDone && (
        <Onboarding onFinish={() => setOnboardingDone(true)}/>
      )}
      <StatusBar/>
      <div className="screen">
        <div className="pad">
          {tab === "home" && <HomeScreen onOpenDrawer={() => setDrawer(true)} onStartWorkout={() => wgo("active")}/>}
          {tab === "workout" && <WorkoutPlaceholder onNav={wgo}/>}
          {tab === "store" && <StoreScreen/>}
          {tab === "profile" && <ProfilePlaceholder onReportBug={() => setBugOpen(true)}/>}
        </div>
      </div>
      <PluginsDrawer open={drawer} onClose={() => setDrawer(false)} onOpen={(id) => { setPlugin(id); setDrawer(false); }}/>
      <div className={"plugin-screen" + (plugin ? " open" : "")}>
        {plugin && <PluginPage id={plugin} onBack={() => setPlugin(null)}/>}
      </div>

      {/* Workout navigation stack */}
      <div className={"workout-screen" + (current ? " open" : "")}>
        {current && current.screen === "active"  && <ActiveSession   onBack={wback} onRest={(d, label) => wgo("rest", { restDuration: d, restLabel: label })} onSummary={() => { wreset(); setTimeout(() => wgo("summary"), 50); }} onOpenExercise={(id) => wgo("detail", { exerciseId: id })} onOpenPicker={() => wgo("picker")} />}
        {current && current.screen === "rest"    && <RestTimer       duration={current.restDuration || 90} nextLabel={current.restLabel} onSkip={wback} onClose={wback} onAdjust={() => {}} />}
        {current && current.screen === "detail"  && <ExerciseDetail   id={current.exerciseId} onBack={wback}/>}
        {current && current.screen === "picker"  && <ExercisePicker   onBack={wback} onAdd={wback}/>}
        {current && current.screen === "program" && <ProgramDetail    onBack={wback}/>}
        {current && current.screen === "ai"      && <AIGenerator      onBack={wback} onStart={() => { wreset(); setTimeout(() => wgo("active"), 50); }}/>}
        {current && current.screen === "summary" && <WorkoutSummary   onBack={wreset} onClose={wreset}/>}
        {current && current.screen === "history" && <HistoryDetail    onBack={wback}/>}
      </div>

      <TabBar active={tab} onChange={setTab}/>

      <BugFab onClick={() => setBugOpen(true)} hidden={bugOpen}/>
      <BugSheet open={bugOpen} onClose={() => setBugOpen(false)} screen={screenLabel}/>

      {paywallOpen && <PaywallScreen onClose={() => setPaywallOpen(false)}/>}
      <RechargeSheet open={rechargeOpen} onClose={() => setRechargeOpen(false)}/>
      {notifsOpen && <NotificationsScreen onBack={() => setNotifsOpen(false)}/>}
      {profileOpen && <ProfileScreen mode={profileOpen} onBack={() => setProfileOpen(null)}/>}
      {settingsOpen && <SettingsScreen onBack={() => setSettingsOpen(false)}/>}
      {searchOpen && <SearchOverlay onClose={() => setSearchOpen(false)}/>}
      {extraScreen && (() => {
        const close = () => setExtraScreen(null);
        const k = extraScreen.kind, p = extraScreen.props;
        switch (k) {
          case "calendar": return <CalendarScreen onBack={close}/>;
          case "help": return <HelpScreen onBack={close}/>;
          case "legal": return <LegalScreen onBack={close}/>;
          case "devices": return <DeviceDetailScreen onBack={close} device={p.device || "watch"}/>;
          case "modules": return <ModulesScreen onBack={close}/>;
          case "referral": return <ReferralScreen onBack={close}/>;
          case "post": return <PostDetailScreen onBack={close}/>;
          case "challenge": return <ChallengeDetailScreen onBack={close}/>;
          case "lift": return <LiftDetailScreen onBack={close} lift={p.lift}/>;
          case "goal": return <GoalEditScreen onBack={close}/>;
          case "builder": return <ProgramBuilderScreen onBack={close}/>;
          case "error": return <ErrorScreen kind={p.kind || "offline"} onAction={close}/>;
          case "ai-chat": return <AIChatScreen onBack={close}/>;
          case "community-chat": return <CommunityChatScreen onBack={close} friend={p.friend}/>;
          case "avatar": return <AvatarUploadScreen onBack={close}/>;
          default: return null;
        }
      })()}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Auth & Onboarding">
          <TweakToggle label="Afficher l'auth" value={tweaks.showAuth} onChange={(v) => { setTweak("showAuth", v); setAuthDone(false); }}/>
          <TweakButton label="Rejouer l'auth" onClick={() => { setTweak("showAuth", true); setAuthDone(false); }}>Démarrer</TweakButton>
          <TweakToggle label="Afficher l'onboarding" value={tweaks.showOnboarding} onChange={(v) => { setTweak("showOnboarding", v); setOnboardingDone(false); }}/>
          <TweakButton label="Rejouer l'onboarding" onClick={() => { setTweak("showOnboarding", true); setOnboardingDone(false); }}>Démarrer</TweakButton>
        </TweakSection>
        <TweakSection title="Écrans">
          <TweakButton label="Profil (le mien)" onClick={() => setProfileOpen("own")}>Ouvrir</TweakButton>
          <TweakButton label="Profil public (autre user)" onClick={() => setProfileOpen("other")}>Ouvrir</TweakButton>
          <TweakButton label="Paramètres" onClick={() => setSettingsOpen(true)}>Ouvrir</TweakButton>
          <TweakButton label="Recherche globale" onClick={() => setSearchOpen(true)}>Ouvrir</TweakButton>
          <TweakButton label="Calendrier" onClick={() => setExtraScreen({ kind: "calendar", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Aide & FAQ" onClick={() => setExtraScreen({ kind: "help", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Mentions légales" onClick={() => setExtraScreen({ kind: "legal", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Appareil détaillé" onClick={() => setExtraScreen({ kind: "devices", props: { device: "watch" } })}>Ouvrir</TweakButton>
          <TweakButton label="Modules activés" onClick={() => setExtraScreen({ kind: "modules", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Parrainage / Code promo" onClick={() => setExtraScreen({ kind: "referral", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Post détail (commu)" onClick={() => setExtraScreen({ kind: "post", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Challenge détail" onClick={() => setExtraScreen({ kind: "challenge", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Détail PR / lift" onClick={() => setExtraScreen({ kind: "lift", props: { lift: "Soulevé de terre" } })}>Ouvrir</TweakButton>
          <TweakButton label="Édition objectif" onClick={() => setExtraScreen({ kind: "goal", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Program builder" onClick={() => setExtraScreen({ kind: "builder", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Chat IA plein écran" onClick={() => setExtraScreen({ kind: "ai-chat", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Chat communauté (thread)" onClick={() => setExtraScreen({ kind: "community-chat", props: {} })}>Ouvrir</TweakButton>
          <TweakButton label="Upload avatar" onClick={() => setExtraScreen({ kind: "avatar", props: {} })}>Ouvrir</TweakButton>
        </TweakSection>
        <TweakSection title="Erreurs & états">
          <TweakButton label="Erreur 404" onClick={() => setExtraScreen({ kind: "error", props: { kind: "404" } })}>Ouvrir</TweakButton>
          <TweakButton label="Hors-ligne" onClick={() => setExtraScreen({ kind: "error", props: { kind: "offline" } })}>Ouvrir</TweakButton>
          <TweakButton label="Crash" onClick={() => setExtraScreen({ kind: "error", props: { kind: "crash" } })}>Ouvrir</TweakButton>
          <TweakButton label="Échec sync" onClick={() => setExtraScreen({ kind: "error", props: { kind: "sync" } })}>Ouvrir</TweakButton>
        </TweakSection>
        <TweakSection title="Style">
          <TweakRadio label="Cards" value={tweaks.cards} onChange={(v) => setTweak("cards", v)}
            options={[
              { value: "flat",    label: "Flat" },
              { value: "shadow",  label: "Shadow" },
              { value: "outlined",label: "Outlined" },
            ]}/>
          <TweakRadio label="Densité" value={tweaks.density} onChange={(v) => setTweak("density", v)}
            options={[
              { value: "compact", label: "Compact" },
              { value: "comfy",   label: "Comfy" },
              { value: "airy",    label: "Aéré" },
            ]}/>
          <TweakSelect label="Typographie" value={tweaks.type} onChange={(v) => setTweak("type", v)}
            options={[
              { value: "manrope",  label: "Manrope · Geist" },
              { value: "geist",    label: "Geist (mono-famille)" },
              { value: "serif-mix",label: "Instrument Serif · Geist" },
            ]}/>
        </TweakSection>
        <TweakSection title="Couleur">
          <TweakColor label="Primaire" value={tweaks.primary} onChange={(v) => setTweak("primary", v)}
            options={["#FF5C1A", "#E94B3C", "#2E9E5B", "#2E7BF6", "#7B5BD0", "#1C1A17"]}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

          <div style={{
            width: 38, height: 38, borderRadius: 11,

          else if (s.label === "Notifications" && window.__openNotifs) window.__openNotifs();
          else if (s.label === "Compte & profil" && window.__openExtra) window.__openExtra("avatar");
          else if (s.label === "Préférences" && window.__openSettings) window.__openSettings();
          else if (s.label === "Inviter des amis" && window.__openExtra) window.__openExtra("referral");
          else if (s.label === "Appareils connectés" && window.__openExtra) window.__openExtra("devices", { device: "watch" });

          else if ((s.label === "Mentions légales" || s.label === "Confidentialité") && window.__openExtra) window.__openExtra("legal");

          padding: "13px 14px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer",
          borderTop: i === 0 ? "none" : "1px solid var(--border)",

              color: "var(--success)",
            }}>{s.badge}</span>
          )}

        </div>
      ))}
    </div>
  );
