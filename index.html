<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ziko — Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>

  :root {
    --bg-stage: #ECEAE3;
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E2E0DA;
    --primary: #FF5C1A;
    --text: #1C1A17;
    --muted: #6B6963;
    --success: #2E9E5B;
    --info: #2E7BF6;
    --violet: #7B5BD0;
    --warn: #E8A33A;

    --r-card: 18px;
    --pad: 16px;
    --gap: 12px;
    --font-display: "Manrope", -apple-system, system-ui, sans-serif;
    --font-body: "Geist", -apple-system, system-ui, sans-serif;
    --font-serif: "Instrument Serif", Georgia, serif;

    --card-bg: #FFFFFF;
    --card-border: 1px solid var(--border);
    --card-shadow: none;
  }
  /* card style modes */
  body[data-cards="flat"]    { --card-border: 1px solid var(--border); --card-shadow: none; }
  body[data-cards="shadow"]  { --card-border: 1px solid transparent; --card-shadow: 0 1px 2px rgba(28,26,23,.04), 0 8px 24px -12px rgba(28,26,23,.08); }
  body[data-cards="outlined"]{ --card-border: 1.5px solid var(--text); --card-shadow: none; }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg-stage);
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 32px 16px 64px;
  }
  .stage {
    width: 100%;
    max-width: 412px;
  }
  .phone {
    position: relative;
    width: 100%;
    height: 880px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 60px -20px rgba(28,26,23,.18),
      0 8px 22px -8px rgba(28,26,23,.10);
    border: 1px solid rgba(28,26,23,.06);
  }
  /* Status bar */
  .statusbar {
    height: 44px;
    padding: 0 22px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-display);
    font-weight: 600; font-size: 13px;
    color: var(--text);
  }
  .statusbar .right { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { display: block; }

  /* Scroll area */
  .screen {
    height: calc(880px - 44px - 76px);
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .screen::-webkit-scrollbar { width: 0; }
  .pad { padding: 4px 18px 28px; }

  /* Tab bar */
  .tabbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 76px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 6px 14px 18px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; user-select: none;
    color: var(--muted);
    transition: color .15s;
  }
  .tab.active { color: var(--primary); }
  .tab .lbl { font-size: 10.5px; font-weight: 600; font-family: var(--font-display); letter-spacing: .02em; }
  .tab svg { width: 24px; height: 24px; }

  /* density */
  body[data-density="compact"] { --pad: 12px; --gap: 8px; --r-card: 14px; }
  body[data-density="comfy"]   { --pad: 16px; --gap: 12px; --r-card: 18px; }
  body[data-density="airy"]    { --pad: 22px; --gap: 18px; --r-card: 22px; }

  /* typography swap */
  body[data-type="manrope"]  { --font-display: "Manrope", system-ui, sans-serif; --font-body: "Geist", system-ui, sans-serif; }
  body[data-type="geist"]    { --font-display: "Geist", system-ui, sans-serif; --font-body: "Geist", system-ui, sans-serif; }
  body[data-type="serif-mix"]{ --font-display: "Instrument Serif", Georgia, serif; --font-body: "Geist", system-ui, sans-serif; }

  /* utility */
  .card {
    background: var(--card-bg);
    border: var(--card-border);
    border-radius: var(--r-card);
    box-shadow: var(--card-shadow);
  }
  .row { display: flex; align-items: center; }
  .h-display { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; }
  .h-body    { font-family: var(--font-body); }
  .muted { color: var(--muted); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255,92,26,.10); color: var(--primary);
    font-size: 11.5px; font-weight: 700; font-family: var(--font-display);
    letter-spacing: .01em;
  }
  .chip.success { background: rgba(46,158,91,.12); color: var(--success); }
  .chip.info    { background: rgba(46,123,246,.10); color: var(--info); }
  .chip.violet  { background: rgba(123,91,208,.10); color: var(--violet); }
  .chip.warn    { background: rgba(232,163,58,.14); color: var(--warn); }
  .chip.ghost   { background: rgba(28,26,23,.06); color: var(--text); }

  .btn {
    border: none; cursor: pointer; font-family: var(--font-display); font-weight: 700;
    border-radius: 14px; padding: 12px 16px; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .12s ease, background .15s ease, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: rgba(28,26,23,.06); color: var(--text); }

  .divider {
    height: 1px; background: var(--border); margin: 18px 0 14px;
  }
  .section-title {
    font-family: var(--font-display); font-weight: 800; font-size: 14px;
    letter-spacing: -.005em;
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 10px;
  }
  .section-title .more { color: var(--muted); font-weight: 600; font-size: 12px; }

  .scroll-x {
    display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -18px; padding: 0 18px 6px;
  }
  .scroll-x::-webkit-scrollbar { height: 0; }
  .scroll-x > * { scroll-snap-align: start; flex: 0 0 auto; }

  /* tweaks panel offset to not cover the phone */
  [data-om-tweaks-panel] { font-family: var(--font-body) !important; }

  /* hero ring breathing */
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  .breathe { animation: breathe 4s ease-in-out infinite; }

  /* skeleton ai pulse */
  @keyframes pulse-bg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* Drawer overlay for "Tous mes outils" */
  .drawer-overlay {
    position: absolute; inset: 0;
    background: rgba(28,26,23,.32);
    backdrop-filter: blur(2px);
    z-index: 30;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top-left-radius: 28px; border-top-right-radius: 28px;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    z-index: 31;
    padding: 8px 18px 22px;
    max-height: 78%;
    overflow-y: auto;
  }
  .drawer::-webkit-scrollbar { width: 0; }
  .drawer.open { transform: translateY(0); }

  /* Plugin push-screen */
  .plugin-screen {
    position: absolute;
    inset: 0 0 76px 0;
    background: var(--bg);
    z-index: 25;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .plugin-screen.open { transform: translateX(0); }
  .plugin-screen .pad { flex: 1; overflow-y: auto; }
  .plugin-screen .pad::-webkit-scrollbar { width: 0; }

  /* Workout push-screen — covers tabbar too for immersion */
  .workout-screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 40;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .workout-screen.open { display: flex; }
  .workout-screen .pad { flex: 1; overflow-y: auto; }
  .workout-screen .pad::-webkit-scrollbar { width: 0; }
  .workout-screen .ws-header { flex: 0 0 auto; }
  .drawer .grab {
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(28,26,23,.18); margin: 8px auto 12px;
  }

</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// --- Helpers locaux compacts ---
function StatTile({ label, value, sub, color = "var(--primary)" }) {
  return (
    <div className="card" style={{ padding: 12 }}>
      <div style={{ fontSize: 10, color: "var(--muted)", fontWeight: 700, letterSpacing: ".06em", textTransform: "uppercase" }}>{label}</div>
      <div className="h-display" style={{ fontSize: 22, marginTop: 4, color }}>{value}</div>
      {sub && <div style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 1 }}>{sub}</div>}
    </div>
  );
}

function MiniBars({ data, color = "var(--primary)", max }) {
  const m = max || Math.max(...data.map((d) => d.v));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 80 }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", gap: 5 }}>
          <div style={{ width: "100%", height: `${(d.v/m)*100}%`, minHeight: 4,
            background: d.today ? color : `color-mix(in srgb, ${color} 28%, transparent)`, borderRadius: 5 }}/>
          <div style={{ fontSize: 9.5, fontWeight: 700, color: d.today ? color : "var(--muted)" }}>{d.l}</div>
        </div>
      ))}
    </div>
  );
}

function RowList({ items, accent = "var(--primary)" }) {
  return (
    <div style={{ display: "grid", gap: 6 }}>
      {items.map((it, i) => (
        <div key={i} className="card" style={{ padding: 12, display: "flex", alignItems: "center", gap: 12 }}>
          {it.icon && (
            <div style={{ width: 34, height: 34, borderRadius: 10,
              background: `color-mix(in srgb, ${it.color || accent} 14%, transparent)`,
              color: it.color || accent, display: "grid", placeItems: "center", flex: "0 0 auto" }}>
              <Icon name={it.icon} size={15}/>
            </div>
          )}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700 }}>{it.title}</div>
            {it.sub && <div style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 1 }}>{it.sub}</div>}
          </div>
          {it.right && (typeof it.right === "string"
            ? <div className="h-display" style={{ fontSize: 13, color: it.rightColor || "var(--text)" }}>{it.right}</div>
            : it.right)}
        </div>
      ))}
    </div>
  );
}

// ---------- 11. RPE 1RM ----------
function RPEPlugin({ onBack }) {

  // Epley : 1RM = w * (1 + r/30) — adapté avec RPE comme RIR

  const oneRm = Math.round(w * (1 + adj_reps / 30));

const BUG_TYPES = [
  { id: "visual",  label: "Visuel",   icon: "sparkles" },
  { id: "crash",   label: "Plantage", icon: "x" },
  { id: "slow",    label: "Lenteur",  icon: "timer" },
  { id: "data",    label: "Données",  icon: "scale" },
  { id: "other",   label: "Autre",    icon: "chevron-right" },
];

function BugSheet({ open, onClose, screen }) {
  const [type, setType] = useStateBR("visual");
  const [text, setText] = useStateBR("");
  const [attach, setAttach] = useStateBR(true);
  const [sent, setSent] = useStateBR(false);

  // reset on close
  useEffectBR(() => {
    if (!open) {
      const t = setTimeout(() => { setText(""); setType("visual"); setSent(false); setAttach(true); }, 280);
      return () => clearTimeout(t);
    }
  }, [open]);

  const send = () => {

function sessionTotals(s) {
  let totalSets = 0, doneSets = 0, volume = 0;
  s.exercises.forEach((ex) => {

      if (set.done) {

  return { totalSets, doneSets, volume };

// ----- format helpers -----
function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
  return `${m}:${String(ss).padStart(2,"0")}`;
}

// ---- Stepper for kg / reps ----
function Stepper({ value, onChange, step = 2.5, suffix, min = 0, suggest }) {
  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
      <button onClick={() => onChange(Math.max(min, +(value - step).toFixed(2)))} style={{
        width: 26, height: 26, borderRadius: 8, border: "none",
        background: "color-mix(in srgb, var(--text) 6%, transparent)",
        color: "var(--text)", cursor: "pointer", fontSize: 16, fontWeight: 700,
        display: "grid", placeItems: "center",
      }}>−</button>
      <div style={{ minWidth: 52, textAlign: "center" }}>
        <div className="h-display" style={{ fontSize: 18, lineHeight: 1 }}>
          {value}<span style={{ fontSize: 10, color: "var(--muted)", fontWeight: 500, marginLeft: 2 }}>{suffix}</span>
        </div>
        {suggest != null && suggest !== value && (
          <div style={{ fontSize: 9, color: "var(--primary)", fontWeight: 700, marginTop: 1 }}>
            sugg. {suggest}
          </div>
        )}
      </div>
      <button onClick={() => onChange(+(value + step).toFixed(2))} style={{
        width: 26, height: 26, borderRadius: 8, border: "none",
        background: "color-mix(in srgb, var(--text) 6%, transparent)",
        color: "var(--text)", cursor: "pointer", fontSize: 16, fontWeight: 700,
        display: "grid", placeItems: "center",
      }}>+</button>
    </div>
  );
}

// ---- RPE chip selector ----
function RPESelector({ value, onChange }) {

function SetRow({ set, idx, last, isCurrent, onComplete, onUpdate }) {
  const [w, setW] = useStateAS(set.weight);
  const [r, setR] = useStateAS(set.reps);
  const [rpe, setRpe] = useStateAS(set.rpe || null);
  const [showRpe, setShowRpe] = useStateAS(false);

  const handleComplete = () => {
    if (rpe == null) {
      setShowRpe(true);
    } else {
      onComplete(rpe);
      setShowRpe(false);
    }
  };

  const validateRpe = (val) => {
    setRpe(val);
    setTimeout(() => onComplete(val), 220);
  };

  if (set.done) {
    return (
      <div style={{
        display: "flex", alignItems: "center", gap: 10,
        padding: "8px 10px", borderRadius: 10,
        background: "color-mix(in srgb, var(--success) 8%, transparent)",
        opacity: .9,
      }}>
        <div style={{
          width: 22, height: 22, borderRadius: 999,
          background: "var(--success)", color: "#fff",
          display: "grid", placeItems: "center", flex: "0 0 auto",
        }}>
          <Icon name="check" size={12} strokeWidth={2.6} color="#fff"/>
        </div>
        <span style={{ fontSize: 11, color: "var(--muted)", fontWeight: 600 }}>S{idx + 1}</span>
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text)" }}>
          {set.weight}<span style={{ fontSize: 9.5, color: "var(--muted)", marginLeft: 1 }}>kg</span> × {set.reps}
        </span>
        {set.rpe && (
          <span style={{
            marginLeft: "auto", fontSize: 10, padding: "2px 7px", borderRadius: 999,
            background: "color-mix(in srgb, var(--success) 14%, transparent)",
            color: "var(--success)", fontWeight: 700,
          }}>
            RPE {set.rpe}
          </span>
        )}
      </div>
    );
  }

  return (
    <div style={{
      padding: "10px 10px",
      borderRadius: 10,
      background: isCurrent ? "color-mix(in srgb, var(--primary) 6%, transparent)" : "color-mix(in srgb, var(--text) 4%, transparent)",
      border: isCurrent ? "1.5px solid color-mix(in srgb, var(--primary) 32%, transparent)" : "1px solid transparent",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{
          fontSize: 11, fontWeight: 700,
          color: isCurrent ? "var(--primary)" : "var(--muted)",
          minWidth: 22,
        }}>S{idx + 1}</span>

        <Stepper value={w} onChange={(v) => { setW(v); onUpdate("weight", v); }} step={2.5} suffix="kg" suggest={set.weight}/>
        <span style={{ color: "var(--muted)", fontSize: 12 }}>×</span>
        <Stepper value={r} onChange={(v) => { setR(v); onUpdate("reps", v); }} step={1} suffix="rép" min={1} suggest={set.reps}/>

        <button onClick={handleComplete} disabled={!isCurrent} style={{
          marginLeft: "auto",
          padding: "8px 12px", borderRadius: 999, border: "none",
          background: isCurrent ? "var(--primary)" : "color-mix(in srgb, var(--text) 8%, transparent)",
          color: isCurrent ? "#fff" : "var(--muted)",
          fontSize: 11.5, fontWeight: 700, cursor: isCurrent ? "pointer" : "not-allowed",
          display: "flex", alignItems: "center", gap: 4,
        }}>
          <Icon name="check" size={12} strokeWidth={2.4} color={isCurrent ? "#fff" : "currentColor"}/>
          OK
        </button>
      </div>
      {last && (
        <div style={{ fontSize: 10, color: "var(--muted)", marginTop: 5, marginLeft: 30 }}>
          Dernière fois : {last.weight}kg × {last.reps}
        </div>
      )}
      {isCurrent && showRpe && (
        <div style={{ marginTop: 4 }}>
          <div style={{ fontSize: 10.5, fontWeight: 700, color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".06em" }}>
            Sensation (RPE) ?
          </div>
          <RPESelector value={rpe} onChange={validateRpe}/>
        </div>
      )}
    </div>
  );
}

// ===== Main ActiveSession =====
function ActiveSession({ onBack, onRest, onSummary, onOpenExercise, onOpenPicker }) {
  const sess = SESSION_DATA;
  const [exercises, setExercises] = useStateAS(sess.exercises);
  const [currentExIdx, setCurrentExIdx] = useStateAS(1); // exo 2 in progress
  const [currentSetIdx, setCurrentSetIdx] = useStateAS(1); // set 2 of exo 2
  const [elapsed, setElapsed] = useStateAS(sess.elapsed);
  const [hr, setHr] = useStateAS(sess.hr);
  const [aiTip, setAiTip] = useStateAS({
    label: "Coach IA · Suggestion",
    text: "Ta dernière série était facile (RPE 7). Essaie 95 kg pour celle-ci, vise 7 reps.",
    actions: ["Adopter"],
  });

  // mock elapsed timer + HR fluctuation
  useEffectAS(() => {
    const t = setInterval(() => {
      setElapsed((e) => e + 1);
      setHr((h) => Math.max(115, Math.min(145, h + Math.round((Math.random() - 0.5) * 4))));
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const totals = sessionTotals({ exercises });
  const progressPct = (totals.doneSets / totals.totalSets) * 100;

  const completeSet = (setIdx, rpe) => {
    const newEx = exercises.map((ex, i) => {
      if (i !== currentExIdx) return ex;
      const newSets = ex.sets.map((s, j) => j === setIdx ? { ...s, done: true, rpe } : s);
      return { ...ex, sets: newSets };
    });
    setExercises(newEx);

    // advance — go to rest
    const ex = newEx[currentExIdx];
    const allDone = ex.sets.every((s) => s.done);
    if (allDone) {
      // mark exo done, move to next
      const upd = newEx.map((e, i) => i === currentExIdx ? { ...e, done: true, current: false } : e);
      setExercises(upd);
      if (currentExIdx + 1 < upd.length) {
        setCurrentExIdx(currentExIdx + 1);
        setCurrentSetIdx(0);
        setAiTip(null);
        onRest && onRest(120);
      } else {
        // all done
        onSummary && onSummary();
      }
    } else {
      setCurrentSetIdx(setIdx + 1);
      onRest && onRest(90);
    }
  };

  const updateSet = (setIdx, field, val) => {
    setExercises(exercises.map((ex, i) => {
      if (i !== currentExIdx) return ex;
      const newSets = ex.sets.map((s, j) => j === setIdx ? { ...s, [field]: val } : s);
      return { ...ex, sets: newSets };
    }));
  };

  return (
    <>
      <WSHeader
        title={sess.name}
        sub={sess.programName}
        onBack={onBack}
        right={
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <HRPill bpm={hr}/>
            <button title="Mode partenaire (lecture vocale)" style={{
              width: 32, height: 32, borderRadius: 10, border: "none", cursor: "pointer",
              background: "color-mix(in srgb, var(--primary) 12%, transparent)",
              color: "var(--primary)", display: "grid", placeItems: "center",
            }}>
              <Icon name="bell" size={14} strokeWidth={2}/>
            </button>
          </div>
        }
      />
      <div className="pad" style={{ padding: "12px 18px 100px" }}>
        {/* Stat strip */}
        <div className="card" style={{ padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <div>
              <div style={{ fontSize: 9.5, fontWeight: 800, color: "var(--muted)", letterSpacing: ".08em", textTransform: "uppercase" }}>
                Temps écoulé
              </div>
              <div className="h-display" style={{ fontSize: 20, lineHeight: 1, marginTop: 3 }}>{fmtTime(elapsed)}</div>
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 9.5, fontWeight: 800, color: "var(--muted)", letterSpacing: ".08em", textTransform: "uppercase" }}>
                Séries
              </div>
              <div className="h-display" style={{ fontSize: 20, lineHeight: 1, marginTop: 3 }}>
                {totals.doneSets}<span style={{ fontSize: 12, color: "var(--muted)", fontWeight: 500 }}>/{totals.totalSets}</span>
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 9.5, fontWeight: 800, color: "var(--muted)", letterSpacing: ".08em", textTransform: "uppercase" }}>
                Volume
              </div>
              <div className="h-display" style={{ fontSize: 20, lineHeight: 1, marginTop: 3 }}>
                {(totals.volume / 1000).toFixed(1)}<span style={{ fontSize: 11, color: "var(--muted)" }}>t</span>
              </div>
            </div>
          </div>
          <div style={{ height: 4, background: "rgba(28,26,23,.06)", borderRadius: 999, overflow: "hidden" }}>
            <div style={{ width: `${progressPct}%`, height: "100%", background: "var(--primary)", borderRadius: 999, transition: "width .3s" }}/>
          </div>
        </div>

        {/* IA contextuelle */}
        <IASessionTip tip={aiTip} onClose={() => setAiTip(null)}/>

        {/* Exercises list */}
        <div style={{ display: "grid", gap: 10 }}>
          {exercises.map((ex, i) => (
            <ExerciseCard
              key={ex.id}
              ex={ex}
              exIdx={i}
              currentExIdx={currentExIdx}
              currentSetIdx={i === currentExIdx ? currentSetIdx : -1}
              onCompleteSet={completeSet}
              onSetUpdate={updateSet}
              onSwap={() => alert("Substituer " + ex.name)}
              onOpenDetail={() => onOpenExercise && onOpenExercise(ex.id)}
            />
          ))}
        </div>

        {/* Add / skip */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
          <button onClick={onOpenPicker} className="card" style={{
            padding: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: "transparent", border: "1px dashed var(--border)",
            color: "var(--text)", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
          }}>
            <Icon name="plus" size={14}/> Ajouter un exercice
          </button>
          <button className="card" style={{
            padding: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: "transparent", border: "1px dashed var(--border)",
            color: "var(--muted)", fontSize: 12.5, fontWeight: 600, cursor: "pointer",
          }}>
            Sauter cet exo
          </button>
        </div>
      </div>

      {/* Footer CTA */}
      <div style={{
        position: "absolute", left: 0, right: 0, bottom: 0,
        padding: "10px 18px 14px",
        background: "linear-gradient(to top, var(--bg) 75%, transparent)",
        zIndex: 5,
      }}>
        <button onClick={onSummary} className="btn" style={{
          width: "100%", padding: "12px 16px", borderRadius: 14,
          background: "var(--text)", color: "#FFFAF6",
          fontSize: 13, fontWeight: 700, border: "none", cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        }}>
          Terminer la séance
          <Icon name="check" size={14} color="#FFFAF6" strokeWidth={2.4}/>
        </button>
      </div>
    </>
  );
}

const { useState: useStateRT, useEffect: useEffectRT } = React;

// ----- Rest Timer plein écran -----
function RestTimer({ duration = 90, nextLabel, onSkip, onAdjust, onClose }) {
  const [remaining, setRemaining] = useStateRT(duration);
  const [paused, setPaused] = useStateRT(false);

  useEffectRT(() => { setRemaining(duration); }, [duration]);
  useEffectRT(() => {
    if (paused) return;
    const t = setInterval(() => {
      setRemaining((r) => {
        if (r <= 1) { clearInterval(t); setTimeout(() => onClose && onClose(), 600); return 0; }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [paused, duration]);

  const pct = remaining / duration;
  const r = 110;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct);

  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  return (
    <div style={{
      position: "absolute", inset: 0,
      background: "linear-gradient(160deg, #1C1A17 0%, #2A211B 100%)",
      color: "#FFFAF6",
      display: "flex", flexDirection: "column",
      zIndex: 80,
      animation: "rtFadeIn .25s ease",
    }}>
      <style>{`
        @keyframes rtFadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes ringPulse { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
        @keyframes hrbeat { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.4) } }
      `}</style>

      <div style={{ display: "flex", alignItems: "center", padding: "14px 18px" }}>
        <div style={{
          fontSize: 10, fontWeight: 800, letterSpacing: ".12em", textTransform: "uppercase",
          color: "rgba(255,250,246,.55)",
        }}>
          Repos
        </div>
        <button onClick={onClose} style={{
          marginLeft: "auto",
          width: 36, height: 36, borderRadius: 12,
          background: "rgba(255,250,246,.08)", color: "#FFFAF6",
          border: "none", cursor: "pointer",
          display: "grid", placeItems: "center",
        }}>
          <Icon name="x" size={16} color="#FFFAF6"/>
        </button>
      </div>

      <div style={{ flex: 1, display: "grid", placeItems: "center", padding: "0 24px" }}>
        <div style={{ position: "relative", width: 260, height: 260 }}>
          <svg width="260" height="260" style={{ transform: "rotate(-90deg)" }}>
            <circle cx="130" cy="130" r={r}
              stroke="rgba(255,250,246,.08)" strokeWidth="10" fill="none"/>
            <circle cx="130" cy="130" r={r}
              stroke="url(#restGrad)" strokeWidth="10" fill="none"
              strokeLinecap="round"
              strokeDasharray={circ}
              strokeDashoffset={offset}
              style={{ transition: "stroke-dashoffset 1s linear", animation: remaining <= 5 ? "ringPulse .8s ease infinite" : "none" }}
            />
            <defs>
              <linearGradient id="restGrad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0%" stopColor="var(--primary)"/>
                <stop offset="100%" stopColor="#FFB07A"/>
              </linearGradient>
            </defs>
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", textAlign: "center" }}>
            <div>
              <div className="h-display" style={{ fontSize: 76, lineHeight: 1, fontFeatureSettings: "'tnum'" }}>
                {fmt(remaining)}
              </div>
              <div style={{ fontSize: 11, color: "rgba(255,250,246,.5)", marginTop: 6, fontWeight: 600 }}>
                / {fmt(duration)}
              </div>
            </div>
          </div>
        </div>

        {nextLabel && (
          <div style={{ marginTop: 24, textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: "rgba(255,250,246,.5)", letterSpacing: ".1em", textTransform: "uppercase" }}>
              Prochaine série
            </div>
            <div style={{ fontSize: 16, marginTop: 4, fontWeight: 600 }}>{nextLabel}</div>
          </div>
        )}
      </div>

      {/* controls */}
      <div style={{ padding: "0 24px 16px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        <button onClick={() => setRemaining((r) => Math.max(0, r - 30))} style={{
          padding: "12px", borderRadius: 14, border: "1px solid rgba(255,250,246,.14)",
          background: "rgba(255,250,246,.06)", color: "#FFFAF6",
          fontSize: 12, fontWeight: 700, cursor: "pointer",
        }}>−30s</button>
        <button onClick={() => setPaused((p) => !p)} style={{
          padding: "12px", borderRadius: 14, border: "none",
          background: "rgba(255,250,246,.92)", color: "#1C1A17",
          fontSize: 12, fontWeight: 800, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
        }}>
          {paused ? <><Icon name="play" size={12} color="#1C1A17"/> Reprendre</> : "Pause"}
        </button>
        <button onClick={() => setRemaining((r) => r + 30)} style={{
          padding: "12px", borderRadius: 14, border: "1px solid rgba(255,250,246,.14)",
          background: "rgba(255,250,246,.06)", color: "#FFFAF6",
          fontSize: 12, fontWeight: 700, cursor: "pointer",
        }}>+30s</button>
      </div>
      <div style={{ padding: "0 24px 24px" }}>
        <button onClick={onSkip} style={{
          width: "100%", padding: "14px", borderRadius: 16, border: "none",
          background: "var(--primary)", color: "#fff",
          fontSize: 13.5, fontWeight: 800, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        }}>
          <Icon name="play" size={13} color="#fff"/>
          Reprendre maintenant
        </button>
      </div>
    </div>
  );
}

const FILTERS = ["Favoris", "Pectoraux", "Dos", "Jambes", "Épaules", "Bras", "Abdos"];

function ExercisePicker({ onBack, onAdd }) {
  const [q, setQ] = useStateED("");
  const [filter, setFilter] = useStateED("Favoris");
  const [selected, setSelected] = useStateED([]);

  const ql = q.toLowerCase();
  const list = PICKER_EXOS.filter((e) => {
    if (q && !(e.name.toLowerCase().includes(ql) || e.muscle.toLowerCase().includes(ql))) return false;
    if (filter === "Favoris") return e.fav;
    if (filter === "Bras") return e.muscle === "Biceps" || e.muscle === "Triceps";
    if (filter !== "Tous") return e.muscle === filter;
    return true;
  });

  const toggle = (id) => setSelected((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);

  return (
    <>
      <WSHeader title="Ajouter un exercice" sub={`${PICKER_EXOS.length} exercices · ${selected.length} sélectionnés`} onBack={onBack}/>
      <div className="pad" style={{ padding: "12px 18px 100px" }}>
        {/* Search */}
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          padding: "10px 14px", borderRadius: 12,

          </svg>
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="Rechercher un exercice…"
            style={{

              fontSize: 13, color: "var(--text)", fontFamily: "inherit",
            }}
          />
          {q && (
            <button onClick={() => setQ("")} style={{ border: "none", background: "transparent", cursor: "pointer", color: "var(--muted)" }}>
              <Icon name="x" size={14}/>
            </button>
          )}
        </div>

        {/* Filters */}
        <div style={{ display: "flex", gap: 6, marginTop: 10, overflowX: "auto", paddingBottom: 4, scrollbarWidth: "none" }}>
          {FILTERS.map((f) => {
            const active = filter === f;
            return (
              <button key={f} onClick={() => setFilter(f)} style={{
                padding: "6px 12px", borderRadius: 999,
                border: active ? "1.5px solid var(--primary)" : "1px solid var(--border)",
                background: active ? "color-mix(in srgb, var(--primary) 10%, transparent)" : "var(--surface)",
                color: active ? "var(--primary)" : "var(--text)",
                fontSize: 11.5, fontWeight: 700, whiteSpace: "nowrap", cursor: "pointer", flex: "0 0 auto",

                {f === "Favoris" && "★ "}{f}
              </button>
            );
          })}
        </div>

        {/* List */}
        <div style={{ display: "grid", gap: 6, marginTop: 12 }}>
          {list.map((e) => {
            const sel = selected.includes(e.id);
            return (
              <div key={e.id} onClick={() => toggle(e.id)} className="card" style={{
                padding: 12, display: "flex", alignItems: "center", gap: 12, cursor: "pointer",
                border: sel ? "1.5px solid var(--primary)" : "var(--card-border)",
                background: sel ? "color-mix(in srgb, var(--primary) 6%, var(--card-bg))" : "var(--card-bg)",
              }}>
                <div style={{
                  width: 22, height: 22, borderRadius: 6, flex: "0 0 auto",
                  border: sel ? "none" : "1.5px solid var(--border)",
                  background: sel ? "var(--primary)" : "transparent",
                  display: "grid", placeItems: "center",
                }}>
                  {sel && <Icon name="check" size={12} color="#fff" strokeWidth={2.6}/>}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 12.5, fontWeight: 700 }}>{e.name}</span>
                    {e.fav && <span style={{ color: "var(--primary)", fontSize: 10 }}>★</span>}
                  </div>
                  <div style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 2 }}>
                    {e.muscle} · {e.equip}{e.pr ? ` · PR ${e.pr}` : ""}

                </div>
              </div>
            );
          })}
          {list.length === 0 && (
            <div style={{ padding: 24, textAlign: "center", color: "var(--muted)", fontSize: 12 }}>
              Aucun exercice trouvé.
            </div>
          )}

// ===== AI Generator =====
function AIGenerator({ onBack, onStart }) {
  const [step, setStep] = useStatePD(0);
  const [answers, setAnswers] = useStatePD({
    energy: 7,
    duration: 45,
    focus: "haut",
    equipment: "salle",
    avoid: [],
  });
  const [generating, setGenerating] = useStatePD(false);

  const next = () => {
    if (step === 3) {
      setGenerating(true);
      setTimeout(() => { setGenerating(false); setStep(4); }, 1800);
    } else {
      setStep(step + 1);
    }
  };

  const setAns = (k, v) => setAnswers((a) => ({ ...a, [k]: v }));

  if (generating) {
    return (
      <>
        <WSHeader title="Génération…" onBack={onBack}/>
        <div style={{ padding: "60px 24px", textAlign: "center" }}>
          <div style={{
            width: 80, height: 80, borderRadius: 999, margin: "0 auto",
            background: "linear-gradient(135deg, var(--primary), #FFB07A)",
            display: "grid", placeItems: "center",
            animation: "pulse 1.4s ease-in-out infinite",
          }}>
            <Icon name="sparkles" size={36} color="#fff"/>
          </div>
          <style>{`@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.08); opacity: .85 } }`}</style>
          <div className="h-display" style={{ fontSize: 22, marginTop: 22 }}>
            Coach IA travaille<span className="dots">...</span>
          </div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 8, lineHeight: 1.5 }}>
            On adapte la séance à ton énergie ({answers.energy}/10),<br/>
            ton historique et le matériel dispo.
          </div>
        </div>
      </>
    );
  }

  if (step === 4) {
    // Generated session
    const exos = [
      { name: "Développé incliné haltères", sets: "3 × 8-10", note: "charge légère vu énergie 7/10" },
      { name: "Développé couché barre",     sets: "4 × 6-8" },
      { name: "Écarté machine",              sets: "3 × 12" },
      { name: "Dips lestés",                 sets: "3 × 8" },
      { name: "Extensions triceps poulie",   sets: "3 × 12" },
    ];
    return (
      <>
        <WSHeader title="Ta séance générée" sub={`~${answers.duration} min · adapté à toi`} onBack={onBack}/>
        <div className="pad" style={{ padding: "12px 18px 100px" }}>
          <div className="card" style={{
            padding: 14,
            background: "linear-gradient(135deg, rgba(255,92,26,.08), rgba(123,91,208,.05))",
            border: "1px solid color-mix(in srgb, var(--primary) 22%, var(--border))",
            display: "flex", gap: 10, alignItems: "flex-start",
          }}>
            <div style={{
              width: 32, height: 32, borderRadius: 10, flex: "0 0 auto",
              background: "var(--text)", color: "#FFE6D9",
              display: "grid", placeItems: "center",
            }}>
              <Icon name="sparkles" size={15}/>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 9.5, fontWeight: 800, color: "var(--primary)", letterSpacing: ".08em", textTransform: "uppercase" }}>
                Adaptations IA
              </div>
              <div style={{ fontSize: 12, lineHeight: 1.4, marginTop: 4 }}>
                Ton énergie est moyenne (7/10) → j'ai allégé la charge sur le 1er exo. J'ai aussi évité les épaules vu ta gêne précédente.
              </div>
            </div>
          </div>

          <div style={{ marginTop: "var(--gap)" }}>
            <div className="section-title">5 exercices</div>
            <div style={{ display: "grid", gap: 6 }}>
              {exos.map((ex, i) => (
                <div key={i} className="card" style={{ padding: 12, display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{
                    width: 26, height: 26, borderRadius: 8,
                    background: "color-mix(in srgb, var(--primary) 12%, transparent)",

                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700 }}>{ex.name}</div>
                    <div style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 1 }}>
                      {ex.sets}{ex.note ? ` · ${ex.note}` : ""}

                </div>
              ))}
            </div>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button onClick={() => setStep(0)} className="btn btn-ghost" style={{
              padding: "10px 14px", borderRadius: 12, fontSize: 12, flex: 1,

              <Icon name="sparkles" size={13}/> Régénérer

      <WSHeader title="Coach IA" sub={`Étape ${step + 1}/4`} onBack={onBack}/>

        {step === 0 && (
          <>

              style={{ width: "100%", marginTop: 14, accentColor: "var(--primary)" }}

            </div>
            <div style={{ display: "grid", gap: 8, marginTop: 22 }}>
              {[20, 30, 45, 60, 90].map((d) => {
                const sel = answers.duration === d;
                return (
                  <button key={d} onClick={() => setAns("duration", d)} className="card" style={{
                    padding: 14, display: "flex", alignItems: "center", gap: 12, cursor: "pointer",

                { id: "cardio",label: "Cardio + core",  sub: "Léger, récup active",      icon: "heart"  },
              ].map((o) => {

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 22 }}>

        background: "linear-gradient(to top, var(--bg) 75%, transparent)",

          background: "var(--primary)", color: "#fff",
          fontSize: 13, fontWeight: 700, border: "none", cursor: "pointer",
        }}>
          {step === 3 ? "Générer ma séance" : "Continuer"}
        </button>
      </div>
    </>
  );

// ---------- Shell ----------
function OnboardingShell({ step, total, onBack, onNext, canNext, ctaLabel, children, hideNav, fullBleed }) {
  return (
    <div style={{
      position: "absolute", inset: 0, zIndex: 60,
      background: "var(--bg)", display: "flex", flexDirection: "column",
    }}>
      {/* progress + back */}
      <div style={{
        flex: "0 0 auto", padding: "14px 18px 8px",
        display: "flex", alignItems: "center", gap: 12,
      }}>
        <button onClick={onBack} disabled={step === 0} style={{
          width: 32, height: 32, borderRadius: 10, border: "none",
          background: step === 0 ? "transparent" : "color-mix(in srgb, var(--text) 6%, transparent)",
          color: step === 0 ? "transparent" : "var(--text)",
          cursor: step === 0 ? "default" : "pointer", display: "grid", placeItems: "center",
          flex: "0 0 auto",
        }}>
          <Icon name="chevron-right" size={16} style={{ transform: "rotate(180deg)" }}/>
        </button>
        <div style={{ flex: 1, height: 4, background: "color-mix(in srgb, var(--text) 8%, transparent)", borderRadius: 999, overflow: "hidden" }}>
          <div style={{
            width: `${((step + 1) / total) * 100}%`, height: "100%",
            background: "var(--primary)", borderRadius: 999,
            transition: "width .35s cubic-bezier(.2,.8,.2,1)",
          }}/>
        </div>
        <div style={{ fontSize: 11, fontWeight: 700, color: "var(--muted)", minWidth: 28, textAlign: "right" }}>
          {step + 1}/{total}
        </div>
      </div>

      {/* content */}
      <div style={{ flex: 1, overflowY: "auto", padding: fullBleed ? 0 : "8px 22px 16px" }}>
        {children}
      </div>

      {/* CTA */}
      {!hideNav && (
        <div style={{
          flex: "0 0 auto", padding: "10px 18px 22px",
          background: "linear-gradient(to top, var(--bg) 70%, transparent)",
        }}>
          <button
            onClick={canNext ? onNext : undefined}
            className="btn btn-primary"
            style={{
              width: "100%", padding: "15px", fontSize: 15, borderRadius: 16,
              opacity: canNext ? 1 : .35,

              transition: "opacity .2s",

}

// ---------- Step: Prep / Loader ----------
function OBPrep({ profile, onFinish, ...nav }) {
  const [phase, setPhase] = useStateOB(0);
  const phases = [
    "Analyse de ton profil",
    "Calcul de tes besoins caloriques",
    "Sélection des exercices adaptés",
    "Construction de ton programme",
    "Calibration du coach IA",
  ];
  useEffectOB(() => {
    if (phase < phases.length) {
      const t = setTimeout(() => setPhase(phase + 1), 700);
      return () => clearTimeout(t);
    }
  }, [phase]);
  const done = phase >= phases.length;

  if (done) return <OBReady profile={profile} onFinish={onFinish} {...nav}/>;

  return (
    <OnboardingShell {...nav} hideNav>
      <div style={{ display: "flex", flexDirection: "column", height: "100%", padding: "0 22px" }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
          <div style={{
            width: 64, height: 64, borderRadius: 18,
            background: "linear-gradient(135deg, var(--primary), #FF8E5A)",
            display: "grid", placeItems: "center", marginBottom: 20,
            animation: "ob-pulse 1.6s ease-in-out infinite",
          }}>
            <Icon name="sparkles" size={28} color="#fff"/>
          </div>
          <div className="h-display" style={{ fontSize: 26, lineHeight: 1.15 }}>
            On prépare ton<br/>plan, {profile.name || "champion"}…
          </div>
          <div style={{ display: "grid", gap: 10, marginTop: 24 }}>
            {phases.map((p, i) => {
              const isDone = i < phase;
              const isCurrent = i === phase;
              return (
                <div key={p} style={{
                  display: "flex", alignItems: "center", gap: 12,
                  opacity: i > phase ? .35 : 1, transition: "opacity .3s",
                }}>
                  <span style={{
                    width: 22, height: 22, borderRadius: "50%",
                    background: isDone ? "var(--success)" : isCurrent ? "var(--primary)" : "color-mix(in srgb, var(--text) 8%, transparent)",
                    display: "grid", placeItems: "center", flex: "0 0 auto",
                    transition: "all .3s",
                  }}>
                    {isDone && <Icon name="check" size={11} color="#fff" strokeWidth={3}/>}
                    {isCurrent && (
                      <span style={{
                        width: 8, height: 8, borderRadius: "50%", background: "#fff",
                        animation: "ob-blink 1s ease-in-out infinite",
                      }}/>
                    )}
                  </span>
                  <span style={{ fontSize: 13.5, fontWeight: isCurrent ? 700 : 500, color: "var(--text)" }}>
                    {p}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </OnboardingShell>
  );
}

// ---------- Root ----------
window.Onboarding = function Onboarding({ onFinish }) {
  const [step, setStep] = useStateOB(0);
  const [profile, setProfile] = useStateOB({
    name: "", goal: "", level: "", frequency: null, equipment: [], bio: null,
  });

  const next = () => setStep((s) => Math.min(s + 1, OB_STEPS.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));
  const set = (k, v) => setProfile((p) => ({ ...p, [k]: v }));

  const navProps = {
    step, total: OB_STEPS.length,
    onBack: back, onNext: next,
  };

  return (
    <>
      <style>{`
        @keyframes ob-pulse { 0%,100% { transform: scale(1); box-shadow: 0 12px 36px -10px rgba(255,92,26,.55); } 50% { transform: scale(1.06); box-shadow: 0 18px 50px -10px rgba(255,92,26,.7); } }
        @keyframes ob-blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
      `}</style>
      {step === 0 && <OBWelcome onNext={next}/>}
      {step === 1 && <OBGoal {...navProps} value={profile.goal} onPick={(v) => set("goal", v)}/>}
      {step === 2 && <OBLevel {...navProps} value={profile.level} onPick={(v) => set("level", v)}/>}
      {step === 3 && <OBFreq {...navProps} value={profile.frequency} onPick={(v) => set("frequency", v)}/>}
      {step === 4 && <OBEquip {...navProps} value={profile.equipment} onPick={(v) => set("equipment", v)}/>}
      {step === 5 && <OBBio {...navProps} value={profile.bio} onPick={(v) => set("bio", v)}/>}
      {step === 6 && <OBPrep {...navProps} profile={{ ...profile, name: "Léo" }} onFinish={onFinish}/>}
    </>
  );
};

// ───────── Sign up ─────────
function AuthSignup({ onBack, onDone, onSignin }) {
  const [name, setName] = useStateAU("");
  const [email, setEmail] = useStateAU("");
  const [pw, setPw] = useStateAU("");
  const valid = name.length > 1 && email.length > 3 && pw.length >= 6;

  // password strength heuristic
  const strength = (() => {
    let s = 0;
    if (pw.length >= 6) s++;
    if (pw.length >= 10) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) s++;
    return s; // 0–4
  })();
  const strengthLbl = ["", "Faible", "Correct", "Fort", "Excellent"][strength];
  const strengthClr = ["transparent", "#E94B3C", "#E8A33A", "#2E9E5B", "var(--success)"][strength];

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto" }}>
      <AuthHeader onBack={onBack} eyebrow="Bienvenue" title="Crée ton compte" sub="2 minutes pour démarrer. Tu pourras compléter ton profil ensuite."/>
      <div style={{ padding: "0 24px", display: "grid", gap: 14 }}>
        <AuthField label="Prénom" value={name} onChange={setName} placeholder="Comment on t'appelle ?"/>
        <AuthField label="Email" type="email" value={email} onChange={setEmail} placeholder="toi@email.com"/>
        <div>
          <AuthField label="Mot de passe" type="password" value={pw} onChange={setPw} placeholder="6 caractères minimum"/>
          {pw.length > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
              <div style={{ flex: 1, display: "flex", gap: 4 }}>
                {[0,1,2,3].map(i => (
                  <div key={i} style={{
                    flex: 1, height: 3, borderRadius: 2,
                    background: i < strength ? strengthClr : "var(--border)",
                    transition: "background .2s",
                  }}/>
                ))}
              </div>
              <span style={{ fontSize: 10.5, fontWeight: 700, color: strengthClr, minWidth: 60, textAlign: "right" }}>
                {strengthLbl}
              </span>
            </div>
          )}
        </div>
      </div>

      <div style={{ flex: 1, minHeight: 16 }}/>

      <div style={{ padding: "16px 24px 24px", display: "grid", gap: 10 }}>
        <button onClick={() => valid && onDone()} disabled={!valid} style={{
          padding: "14px 16px", borderRadius: 14, border: "none",
          cursor: valid ? "pointer" : "not-allowed",
          background: valid ? "var(--primary)" : "color-mix(in srgb, var(--primary) 30%, transparent)",
          color: "#fff", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 14.5,
          boxShadow: valid ? "0 8px 22px -10px rgba(255,92,26,.55)" : "none",
        }}>Continuer</button>
        <div style={{ textAlign: "center", fontSize: 12.5, color: "var(--muted)" }}>
          Déjà un compte ?{" "}
          <span onClick={onSignin} style={{ color: "var(--primary)", fontWeight: 700, cursor: "pointer" }}>Se connecter</span>
        </div>
        <div style={{ textAlign: "center", fontSize: 10.5, color: "var(--muted)", marginTop: 4, lineHeight: 1.5, padding: "0 12px" }}>
          En créant ton compte tu acceptes nos <u>CGU</u> et notre <u>politique de confidentialité</u>.
        </div>
      </div>
    </div>
  );
}

function STGroup({ title, children }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{
        fontSize: 10.5, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase",
        color: "var(--muted)", padding: "4px 4px 8px",
      }}>{title}</div>

            {c}
          </>
        ))}
      </div>
    </div>

}

function STRow({ icon, tint, label, sub, right, danger, onClick, toggle, toggleValue, onToggle }) {
  return (
    <div onClick={onClick} style={{
      display: "flex", alignItems: "center", gap: 12, padding: "11px 10px",
      cursor: onClick || toggle ? "pointer" : "default", borderRadius: 10,
    }}>
      <span style={{
        width: 32, height: 32, borderRadius: 9, flex: "0 0 auto",
        background: `color-mix(in srgb, ${tint} 14%, transparent)`,
        color: tint, display: "grid", placeItems: "center",

        <Icon name={icon} size={15} strokeWidth={2}/>
      </span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: danger ? "#E94B3C" : "var(--text)" }}>{label}</div>
        {sub && <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 1 }}>{sub}</div>}
      </div>
      {toggle ? (
        <STToggle value={toggleValue} onChange={onToggle}/>
      ) : right ? (
        <div style={{ fontSize: 12, color: "var(--muted)", fontWeight: 600, marginRight: 4 }}>{right}</div>
      ) : (
        <Icon name="chevron-right" size={14} color="var(--muted)"/>
      )}
    </div>
  );
}

function STToggle({ value, onChange }) {
  return (
    <button onClick={(e) => { e.stopPropagation(); onChange(!value); }} style={{
      width: 40, height: 24, borderRadius: 999, border: "none", cursor: "pointer",
      background: value ? "var(--success)" : "color-mix(in srgb, var(--text) 12%, transparent)",
      position: "relative", transition: "background .2s", flex: "0 0 auto",
    }}>
      <span style={{
        position: "absolute", top: 2, left: value ? 18 : 2,
        width: 20, height: 20, borderRadius: "50%", background: "#fff",
        transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.2)",
      }}/>
    </button>
  );
}

window.CalendarScreen = function CalendarScreen({ onBack }) {
  const [month, setMonth] = useStateEX(0); // 0 = current
  const [selDay, setSelDay] = useStateEX(15);
  const today = 12;

  // mock — sessions par jour
  const sessions = {
    1: { type: "Push", color: "var(--primary)" }, 3: { type: "Pull", color: "var(--info)" },
    5: { type: "Legs", color: "var(--success)" }, 8: { type: "Push", color: "var(--primary)" },
    10: { type: "Pull", color: "var(--info)" }, 12: { type: "Aujourd'hui · Legs", color: "var(--text)" },
    15: { type: "Push", color: "var(--primary)" }, 17: { type: "Pull", color: "var(--info)" },
    19: { type: "Legs", color: "var(--success)" }, 22: { type: "Push", color: "var(--primary)" },
    24: { type: "Pull", color: "var(--info)" }, 26: { type: "Repos actif", color: "var(--muted)" },
  };
  const monthName = ["Novembre", "Décembre", "Janvier"][month] || "Novembre";

  return (
    <ExScreen>
      <ExHeader onBack={onBack} title={`${monthName} 2025`} right={
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => setMonth(m => Math.max(0, m-1))} className="btn btn-ghost" style={{ padding: 8, borderRadius: 10 }}>
            <Icon name="chevron-right" size={14} style={{ transform: "rotate(180deg)" }}/>
          </button>
          <button onClick={() => setMonth(m => m+1)} className="btn btn-ghost" style={{ padding: 8, borderRadius: 10 }}>
            <Icon name="chevron-right" size={14}/>
          </button>
        </div>
      }/>
      <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 24px" }}>
        {/* Stats month */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
          {[
            { n: "14", l: "Séances" }, { n: "11h", l: "Volume" }, { n: "3", l: "PR" },
          ].map((s, i) => (
            <div key={i} className="card" style={{ padding: 10, textAlign: "center" }}>
              <div className="h-display" style={{ fontSize: 18 }}>{s.n}</div>
              <div style={{ fontSize: 10.5, color: "var(--muted)", fontWeight: 700, letterSpacing: ".04em", textTransform: "uppercase", marginTop: 2 }}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* Weekday header */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 6 }}>
          {["L","M","M","J","V","S","D"].map((d, i) => (
            <div key={i} style={{ textAlign: "center", fontSize: 10, fontWeight: 800, color: "var(--muted)", letterSpacing: ".08em" }}>{d}</div>
          ))}
        </div>

        {/* Days grid (30 days, starts on tuesday for visual) */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {Array.from({ length: 30 }).map((_, i) => {
            const day = i + 1;
            const s = sessions[day];
            const isToday = day === today;
            const isSel = day === selDay;
            return (
              <button key={day} onClick={() => setSelDay(day)} className="card" style={{
                aspectRatio: "1", padding: 0, position: "relative", cursor: "pointer",
                background: isSel ? "var(--text)" : "var(--card-bg)",
                color: isSel ? "#fff" : "var(--text)",
                border: isToday && !isSel ? "1.5px solid var(--primary)" : "var(--card-border)",
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3,
              }}>
                <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "var(--font-display)" }}>{day}</div>
                {s && <div style={{ width: 5, height: 5, borderRadius: "50%", background: isSel ? "#fff" : s.color }}/>}
              </button>
            );
          })}
        </div>

        {/* Selected day detail */}
        <div className="card" style={{ marginTop: 16, padding: 14 }}>
          <div style={{ fontSize: 10.5, fontWeight: 800, color: "var(--muted)", letterSpacing: ".08em", textTransform: "uppercase" }}>
            {selDay} {monthName}
          </div>
          {sessions[selDay] ? (
            <>
              <div className="h-display" style={{ fontSize: 17, marginTop: 4 }}>{sessions[selDay].type}</div>
              <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>
                {selDay <= today ? "5 exercices · 42 min · 12,4 t" : "5 exercices prévus · 18:00"}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="btn" style={{ padding: "8px 14px", fontSize: 12, borderRadius: 999, background: "var(--text)", color: "#fff" }}>
                  {selDay <= today ? "Voir détails" : "Démarrer"}
                </button>
                <button className="btn btn-ghost" style={{ padding: "8px 14px", fontSize: 12, borderRadius: 999 }}>Modifier</button>
              </div>
            </>
          ) : (
            <>
              <div className="h-display" style={{ fontSize: 17, marginTop: 4 }}>Repos</div>
              <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>Aucune séance prévue</div>
              <button className="btn" style={{ marginTop: 12, padding: "8px 14px", fontSize: 12, borderRadius: 999, background: "var(--primary)", color: "#fff" }}>
                + Planifier
              </button>
            </>
          )}
        </div>
      </div>
    </ExScreen>
  );
};

function ExToggleRow({ icon, tint, label, sub, value, onChange }) {
  return (
    <div style={{ padding: "11px 10px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }} onClick={() => onChange(!value)}>
      <span style={{ width: 32, height: 32, borderRadius: 9, background: `color-mix(in srgb, ${tint} 14%, transparent)`, color: tint, display: "grid", placeItems: "center", flex: "0 0 auto" }}>
        <Icon name={icon} size={14}/>
      </span>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600 }}>{label}</div>
        {sub && <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 1 }}>{sub}</div>}
      </div>
      <button onClick={(e) => { e.stopPropagation(); onChange(!value); }} style={{
        width: 40, height: 24, borderRadius: 999, border: "none", cursor: "pointer",
        background: value ? "var(--success)" : "color-mix(in srgb, var(--text) 12%, transparent)",
        position: "relative", flex: "0 0 auto",
      }}>
        <span style={{ position: "absolute", top: 2, left: value ? 18 : 2, width: 20, height: 20, borderRadius: "50%", background: "#fff", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.2)" }}/>
      </button>
    </div>
  );
}

};

function SearchItem({ item, divide }) {
  return (
    <div style={{
      padding: "11px 10px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer",
      borderTop: divide ? "1px solid var(--border)" : "none",

      </div>
      <Icon name="chevron-right" size={14} color="var(--muted)"/>
    </div>
  );
}

function groupBy(arr, fn) {
  return arr.reduce((acc, x) => { const k = fn(x); (acc[k] = acc[k] || []).push(x); return acc; }, {});
}

window.LiftDetailScreen = function LiftDetailScreen({ onBack, lift = "Soulevé de terre" }) {
  const [range, setRange] = useStateE2("3m");
  // Generate sparkline data
  const data = useMemoE2(() => {
    const ranges = { "1m": 8, "3m": 24, "6m": 48, "1a": 96, "all": 144 };
    const n = ranges[range] || 24;
    const start = 140, end = 175;
    return Array.from({ length: n }).map((_, i) => {
      const t = i / (n - 1);
      const noise = Math.sin(i * 0.7) * 2 + Math.cos(i * 1.3) * 1.5;
      return Math.round(start + (end - start) * Math.pow(t, 1.1) + noise);
    });
  }, [range]);
  const max = Math.max(...data), min = Math.min(...data);

  return (
    <Ex2Screen>
      <Ex2Header onBack={onBack} title={lift} eyebrow="Dos · Bilatéral"/>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 24px" }}>

function pathLine(data, w, h, min, max) {
  return data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = yFor(v, h, min, max);
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(" ");
}
function pathArea(data, w, h, min, max) {
  return pathLine(data, w, h, min, max) + ` L${w} ${h} L0 ${h} Z`;
}
function yFor(v, h, min, max) {
  return h - ((v - min) / (max - min)) * h;
}

      </div>
    </Ex2Screen>
  );
};

    const t = new Date(); const time = `${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}`;
    setMsgs((m) => [...m, { from: "me", text: input, time }]);
    setInput("");
    setTimeout(() => {
      setMsgs((m) => [...m, { from: "them", text: "Cool 🔥", time }]);
    }, 1200);
  };

  return (
    <Ex3Screen fullHeight>
      <div style={{
        flex: "0 0 auto", padding: "10px 14px",
        display: "flex", alignItems: "center", gap: 10,
        borderBottom: "1px solid var(--border)",

          display: "grid", placeItems: "center",
        }}>
          <Icon name="chevron-right" size={16} style={{ transform: "rotate(180deg)" }}/>
        </button>
        <span style={{
          width: 36, height: 36, borderRadius: "50%", background: f.color, color: "#fff",
